<!doctype html>
<html lang="en" class="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem("plainerTheme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Trip | Plainer</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F6F3">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css?v=35">
<script src="/js/theme.js?v=1" defer></script>
<script type="module" src="/js/trip.js?v=16"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="hdr">
  <div class="hdr-in">
    <a class="brand" href="/"><img src="/assets/app-icon.png" alt="" width="34" height="34"><span>Plainer</span></a>
    <nav class="app-nav" aria-label="Personal area">
      <a class="navlink on" href="/trips/" aria-current="page">My trips</a>
      <a class="navlink" href="/support/">Help</a>
    </nav>
    <div class="spacer"></div>
    <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch to dark theme"><svg class="theme-moon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg><svg class="theme-sun" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
    <div class="account">
      <button type="button" class="avatar" id="account-button" aria-label="Account menu" aria-expanded="false" aria-controls="account-menu"></button>
      <div class="menu account-menu" id="account-menu" hidden>
        <div class="menu-head"><strong id="account-name"></strong><span class="muted" id="account-email"></span></div>
        <hr>
        <a href="/profile/">Profile</a>
        <button type="button" id="logout">Log out</button>
      </div>
    </div>
  </div>
</header>
<div id="banner-slot"></div>
<main class="wrap page trip-page" id="main">
  <a class="back-link" href="/trips/"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>All trips</a>
  <div class="skeleton-grid" id="skeleton" aria-busy="true">
    <p class="visually-hidden" role="status">Loading your trip</p>
    <div class="skel skel-title"></div>
    <div class="skel skel-panel"></div>
    <div class="skel skel-panel tall"></div>
  </div>
  <div id="message" hidden></div>
  <div id="trip-app" hidden>
    <div class="trip-top">
    <div class="trip-head">
      <h1 class="display trip-title" id="trip-name"></h1>
      <div class="trip-meta t2">
        <span class="badge" id="trip-status"></span>
        <label class="draft-toggle" id="draft-toggle" hidden><input type="checkbox" role="switch" id="draft-switch" aria-label="Draft"><span id="draft-label"></span></label>
        <span id="trip-dates"></span>
        <span aria-hidden="true" class="muted">·</span>
        <span id="trip-owner"></span>
        <span id="trip-people" class="people"></span>
      </div>
      <p class="muted small readonly-note" id="readonly-note" hidden></p>
    </div>
    <div class="trip-actions">
      <div class="save-status" id="save-status" hidden>
        <span id="save-text"></span>
        <button type="button" class="link-btn" id="save-retry" hidden>Retry</button>
      </div>
      <button type="button" class="btn btn-outline btn-sm" id="share-btn" aria-label="Share" hidden><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.4 3.4-5.5 6.5-5.5s5.7 2.1 6.5 5.5"></path><path d="M19 8v6M16 11h6"></path></svg><span class="btn-label">Share</span></button>
      <button type="button" class="btn btn-outline btn-sm" id="export-btn" aria-label="Export PDF" hidden><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg><span class="btn-label">Export PDF</span></button>
      <div class="account" id="trip-menu-wrap">
        <button type="button" class="icon-btn" id="trip-menu-button" aria-label="More trip actions" aria-haspopup="true" aria-expanded="false" aria-controls="trip-menu"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
        <div class="menu account-menu" id="trip-menu" hidden></div>
      </div>
    </div>
    </div>

    <div class="seg pane-tabs" role="tablist" aria-label="Trip sections">
      <button type="button" role="tab" class="on" id="pane-tab-overview" data-pane="overview" aria-selected="true" aria-controls="pane-overview">Overview</button>
      <button type="button" role="tab" id="pane-tab-stops" data-pane="stops" aria-selected="false" tabindex="-1" aria-controls="pane-stops">Stops</button>
      <button type="button" role="tab" id="pane-tab-days" data-pane="days" aria-selected="false" tabindex="-1" aria-controls="pane-days">Days</button>
    </div>

    <section class="pane overview" id="pane-overview" data-pane="overview" aria-label="Overview" role="tabpanel" aria-labelledby="pane-tab-overview"></section>

    <section class="pane trip-map-pane" id="pane-map" aria-label="Map of the trip’s stops" hidden>
      <div class="trip-map" id="trip-map" role="region" aria-label="Map of the trip’s stops"></div>
    </section>

    <div class="trip-cols">
      <section class="pane days-col" id="pane-days" data-pane="days" aria-labelledby="days-h" role="tabpanel">
        <div class="col-head"><h2 id="days-h" class="display">Days</h2><span class="muted" id="days-sub"></span></div>
        <div class="panel itinerary" id="days-list"></div>
      </section>
      <aside class="pane route-col" id="pane-stops" data-pane="stops" aria-labelledby="route-h" role="tabpanel">
        <div class="col-head"><h2 id="route-h" class="display">Route</h2><span class="muted" id="route-sub"></span><button type="button" class="add" id="add-stop" aria-label="Add stop" hidden>+</button></div>
        <div class="panel itinerary" id="route-list"></div>
      </aside>
    </div>
    <p class="visually-hidden" id="trip-status-live" role="status" aria-live="polite"></p>
  </div>
  <noscript><p class="notice">Your trip needs JavaScript. Please turn it on and reload.</p></noscript>
</main>
</body>
</html>
