<!doctype html>
<html lang="en" class="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem("plainerTheme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Your trips | Plainer</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F6F3">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css?v=10">
<script src="/js/theme.js?v=1" defer></script>
<script type="module" src="/js/trips.js?v=1"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="hdr">
  <div class="hdr-in">
    <a class="brand" href="/"><img src="/assets/app-icon.png" alt="" width="34" height="34"><span>Plainer</span></a>
    <nav class="app-nav" aria-label="Personal area">
      <a class="navlink on" href="/trips/" aria-current="page">My trips</a>
      <a class="navlink" href="/support/">Help</a>
    </nav>
    <div class="spacer"></div>
    <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch to dark theme"><svg class="theme-moon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg><svg class="theme-sun" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
    <div class="account">
      <button type="button" class="avatar" id="account-button" aria-label="Account menu" aria-expanded="false" aria-controls="account-menu"></button>
      <div class="menu account-menu" id="account-menu" hidden>
        <div class="menu-head"><strong id="account-name"></strong><span class="muted" id="account-email"></span></div>
        <hr>
        <a href="/profile/">Profile</a>
        <button type="button" id="logout">Log out</button>
      </div>
    </div>
  </div>
</header>
<div id="banner-slot"></div>
<main class="wrap page" id="main">
  <div class="skeleton-grid" id="skeleton" aria-busy="true">
    <p class="visually-hidden" role="status">Loading your trips</p>
    <div class="cards"><div class="tcard skel"></div><div class="tcard skel"></div><div class="tcard skel"></div><div class="tcard skel"></div></div>
  </div>
  <div id="trips-app" hidden>
    <div class="page-head">
      <div class="page-title">
        <h1 class="display">Trips</h1>
        <span class="muted" id="page-sub"></span>
      </div>
    </div>

    <div class="tabs" role="tablist" aria-label="Which trips">
      <button type="button" role="tab" class="tab on" id="tab-mine" data-tab="mine" aria-selected="true" aria-controls="results">My trips <span class="count">0</span></button>
      <button type="button" role="tab" class="tab" id="tab-shared" data-tab="shared" aria-selected="false" tabindex="-1" aria-controls="results">Shared with me <span class="count">0</span></button>
    </div>

    <div class="toolbar">
      <div class="chips" role="group" aria-label="Filter by status">
        <button type="button" class="chip on" data-status="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-status="upcoming" aria-pressed="false">Upcoming</button>
        <button type="button" class="chip" data-status="active" aria-pressed="false">Active</button>
        <button type="button" class="chip" data-status="draft" aria-pressed="false">Draft</button>
      </div>
      <div class="spacer"></div>
      <label class="search"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input id="search" type="search" placeholder="Search trips" aria-label="Search trips" autocomplete="off"></label>
      <div class="seg" role="group" aria-label="View">
        <button type="button" class="on" data-view="cards" aria-pressed="true"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg><span class="seg-label">Cards</span></button>
        <button type="button" data-view="list" aria-pressed="false"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg><span class="seg-label">List</span></button>
      </div>
    </div>

    <div id="results" role="tabpanel"></div>
    <p class="visually-hidden" id="results-status" role="status" aria-live="polite"></p>
  </div>
  <noscript><p class="notice">Your trips need JavaScript. Please turn it on and reload.</p></noscript>
</main>
</body>
</html>
